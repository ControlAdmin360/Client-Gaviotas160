<!-- Contometros -->
<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>Captura de Contómetros</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root{
      --fg:#1d2430; --muted:#374258; --acc:#1f5fa8; --bd:#e5e7eb; --card:#fff;
      --chip:#f3f4f6; --donebg:#dcfce7; --doneborder:#86efac; --donecolor:#065f46;
      --missbg:#ffe4e6; --missborder:#f9a8d4; --misscolor:#9d174d; --sel:#dbeafe;
    }
    #estado{ color:#f97316; font-weight:600; }
    body{font-family:system-ui,Segoe UI,Roboto,Arial,sans-serif;margin:0;color:var(--fg);background:#f7fafc}
    .wrap{max-width:720px;margin:0 auto;padding:16px}
    .card{background:var(--card);border:1px solid var(--bd);border-radius:12px;box-shadow:0 6px 18px rgba(0,0,0,.06);padding:16px}
    h1{font-size:1.1rem;margin:0 0 8px;color:var(--acc)}
    .row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
    .muted{color:var(--muted);font-size:.92rem}
    .badge{background:var(--chip);padding:6px 10px;border-radius:999px;font-size:.85rem}

    /* Grid de chips */
    .grid{
      display:grid;
      grid-template-columns:repeat(4,minmax(120px,1fr));
      gap:8px;margin-top:10px;
      max-height:54vh; overflow:auto;
      border:1px solid var(--bd); padding:8px; border-radius:8px; background:#fff;
    }
    .idbtn{
      display:flex; flex-direction:column; gap:4px;
      justify-content:center; align-items:center;
      padding:10px; border:1px solid var(--bd); border-radius:8px;
      cursor:pointer; font-weight:600;
    }
    .idbtn.sel{ outline:3px solid var(--sel) }
    .idbtn .chip-reading{ display:none; font-size:.85rem; opacity:.9 }
    .grid.show-readings .idbtn .chip-reading{ display:block }

    .controls{display:flex;gap:18px;margin-top:12px;align-items:end;flex-wrap:wrap;margin-bottom:12px}
    .controls .badge{ margin-top:6px }

    label{font-size:.85rem;font-weight:600}
    input[type="number"]{
      padding:10px; border:1px solid var(--bd); border-radius:8px; font-size:1rem;
      -moz-appearance:textfield; -webkit-appearance:none; appearance:textfield;
    }
    #btnGuardar{ display:none }

    .btn{padding:10px 14px;border-radius:8px;border:1px solid var(--bd);background:#fff;cursor:pointer}
    .btn.primary{background:var(--acc);border-color:var(--acc);color:#fff}
    .btn.close{background:#f3f4f6;border:1px solid #d1d5db;color:#374151;font-weight:600;transition:all .2s}
    .btn.close:hover{background:#e5e7eb;border-color:#9ca3af;color:#111827;box-shadow:0 2px 6px rgba(0,0,0,.08)}

    .btn.warn{ background:#ffedd5; border-color:#fb923c; color:#7c2d12; font-weight:600 }
    .btn.warn:hover{ background:#fed7aa; border-color:#f59e0b; box-shadow:0 2px 6px rgba(0,0,0,.08) }

    .footer{display:flex;align-items:center;gap:8px;margin-top:12px}
    .footer .btn.close{ margin-left:auto }

    /* Quitar spinners numéricos */
    input[type=number]::-webkit-outer-spin-button,
    input[type=number]::-webkit-inner-spin-button { -webkit-appearance:none !important; margin:0 !important; }
    input[type=number]{ -moz-appearance:textfield; appearance:textfield; }

    .input-error{ border:3px solid red !important }
    #msg.warn{ color:#ff6600; font-size:1rem; font-weight:600 }
    #msg.flat{ color:#0284c7; font-size:1rem; font-weight:600 }

    #idSel{ background:#000; color:#fff; font-size:1rem; padding:6px 12px; border-radius:10px; display:inline-block }

    #bloqueFechaNueva{ display:none; gap:8px; align-items:flex-end; flex-wrap:wrap; margin-top:8px }

    #comboFechasWrap .combo{
      padding:10px 10px; height:36px; min-width:100px; border-radius:10px; padding-right:18px;
    }
    #cboFechas option{ font-size:1.05rem }
    #userLogg{
      margin-left:auto;
      background:#111827;
      color:#16a34a;
      border:1px solid #1f2937;
      white-space:nowrap;
    }
  </style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <div class="topbar"><h1>Captura de Contómetros</h1></div>

    <div id="estado" class="muted">Cargando Estado…</div>

    <!-- Combo (solo visible cuando needDate o viewOnly) -->
    <div id="comboFechasWrap" class="right" style="display:none">
      <label for="cboFechas" class="muted" style="margin-top:9px;margin-right:6px">(seleccione un periodo si desea modificar) 👉</label>
      <select id="cboFechas" class="combo" style="margin-right:6px"></select>
    </div>

    <!-- Nueva Fecha + acciones -->
    <div id="bloqueFechaNueva" class="row" style="display:none; margin-top:8px">
      <div id="contenedorNuevaFecha">
        <label>Nueva Fecha de Lecturas</label><br>
        <input type="date" id="inpFechaNueva" style="padding:10px;border:1px solid var(--bd);border-radius:8px;font-size:1rem">
      </div>
      <button class="btn primary" id="btnGuardarFecha" title="Inicia un Nuevo Ciclo de Lecturas">👈Iniciar Ciclo</button>
      <button class="btn warn" id="btnVerLecturas" style="margin-left:43px" title="Ver lecturas del período seleccionado">👆 Cargar Fecha</button>
      <button class="btn" id="btnToggleLecturas" style="display:none">Mostrar lecturas</button>
    </div>

    <div class="row" style="margin-top:8px;display:flex;gap:12px;align-items:center;flex-wrap:wrap">
      <span class="badge">Completados: <span id="hechos">0</span>/<span id="total">0</span></span>
      <span class="badge">Fecha: <span id="fecha">—</span></span>
      <span class="badge" id="userLogg">User: —</span>
    </div>

    <div class="grid" id="gridIds" style="margin-top:10px"></div>

    <div class="controls">
      <div>
        <label>ID seleccionado</label> <br>
        <span class="badge" id="idSel">—</span>
      </div>
      <div>
        <label>Lectura previa</label><br>
        <span class="badge" id="prevVal">—</span>
      </div>
      <div>
        <label>Lectura Actual</label><br>
        <input type="number" id="inpValor" step="1" placeholder="Lectura a Registrar... ">
      </div>
      <button class="btn primary" id="btnGuardar">Guardar</button>
    </div>

    <div class="footer">
      <div id="msg" class="muted"></div>
      <button class="btn close" id="btnClose" type="button">Salir</button>
    </div>
  </div>
</div>

<script>

  (() => {
  // ===== Helpers DOM
  const $ = id => document.getElementById(id);
  const text = (el, t='') => { if (el) el.textContent = t; };
  const show = (el, on, display='') => { if (el) el.style.display = on ? (display || '') : 'none'; };
  const enable = (el, on) => { if (el) el.disabled = !on; };

  // Parámetros URL y Sesión
  const params = new URLSearchParams(location.search);
  const AUTH_USER_PARAM = params.get('user') || '';
  const AUTH_USER = AUTH_USER_PARAM || sessionStorage.getItem('AUTH_USER') || '';
  const AUTH_TOKEN = params.get('token') || sessionStorage.getItem('AUTH_TOKEN') || '';

  function setUserLogg(){
    const el = $('userLogg');
    if (el) el.textContent = 'User: ' + (AUTH_USER || '—');
  }
  setUserLogg();

  function cerrarModal(){
    if (window.parent && window.parent !== window) {
      window.parent.postMessage({ type: 'closeContometros' }, '*');
    }
  }
  $('btnClose')?.addEventListener('click', cerrarModal);

  // ===== Estado local
  let EST = null, seleccionado = null, prevDeSeleccionado = null;
  let modoRevisionManual = false;
  let mostrarLecturas = false;

  const rowsList = () => [...Array(42)].map((_,i)=>5+i).concat([...Array(32)].map((_,i)=>48+i));

  function clearSelectionUI(){
    seleccionado = null; prevDeSeleccionado = null;
    text($('idSel'),'—'); text($('prevVal'),'—');
    const inp = $('inpValor'); if (inp) inp.value = '';
    document.querySelectorAll('.idbtn.sel').forEach(n => n.classList.remove('sel'));
  }

  function pintar(res){
    EST = res;
    // Top info
    text($('estado'), res.mensaje ?? '');
    text($('total'),  res.total ?? 0);
    text($('hechos'), res.total && typeof res.vacias === 'number' ? (res.total - res.vacias) : 0);
    text($('fecha'),  res.fechaForm || '—');

    // Estados
    const pedirFecha       = (res.needDate === true && res.nextCol);
    const esView           = !!res.viewOnly;
    const esCapturaActiva  = !pedirFecha && !esView && !res.doneAll;
    const esRevision       = modoRevisionManual || esView;

    // Fechas (combo)
    const fechasSrc = Array.isArray(res.fechas) ? res.fechas : (Array.isArray(EST?.fechas) ? EST.fechas : []);
    show($('comboFechasWrap'), (pedirFecha || esRevision), 'flex');
    if ((pedirFecha || esRevision) && fechasSrc.length) pintarFechas(fechasSrc);

    // Bloques y controles
    const bloque          = $('bloqueFechaNueva');
    const btnGuardarFecha = $('btnGuardarFecha');
    const btnVerLecturas  = $('btnVerLecturas');
    const btnToggleLect   = $('btnToggleLecturas');
    const grid            = $('gridIds');
    const inpValor        = $('inpValor');
    const btnGuardar      = $('btnGuardar');

    if (pedirFecha) {
      show(bloque, true, 'flex');
      if (esRevision) {
        show(btnGuardarFecha, false);
        show(btnVerLecturas, true, 'inline-block');
        show(btnToggleLect,  true, 'inline-block');
        enable(inpValor, true);
        show(btnGuardar, true, 'inline-block'); enable(btnGuardar, true);
      } else {
        show(btnGuardarFecha, true, 'inline-block');
        show(btnVerLecturas, true, 'inline-block');
        show(btnToggleLect,  false);
        const inpFecha = $('inpFechaNueva'); if (inpFecha) inpFecha.value = '';
        clearSelectionUI();
        if (grid) grid.innerHTML = '';
        enable(inpValor, false);
        show(btnGuardar, false); enable(btnGuardar, false);
        return;
      }
    } else if (esRevision) {
      show(bloque, true, 'flex');
      show(btnGuardarFecha, true);
      show(btnVerLecturas, true, 'inline-block');
      show(btnToggleLect,  true, 'inline-block');
      enable(inpValor, true);
      show(btnGuardar, true, 'inline-block'); enable(btnGuardar, true);
    } else {
      show(bloque, false);
      show(btnGuardarFecha, false);
      show(btnVerLecturas, false);
      show(btnToggleLect,  false);
      enable(inpValor, true);
      show(btnGuardar, true, 'inline-block'); enable(btnGuardar, true);
    }

    // Toggle lecturas en chips
    if (grid) grid.classList.toggle('show-readings', mostrarLecturas);
    if (btnToggleLect) btnToggleLect.textContent = mostrarLecturas ? 'Ocultar lecturas' : 'Mostrar lecturas';

    if (res.doneAll){
      if (grid) grid.innerHTML = '';
      enable(btnGuardar, false);
      return;
    }

    renderGrid(res);
  }

  function pintarFechas(arr){
    const sel = $('cboFechas'); if (!sel) return;
    sel.innerHTML = '';
    (arr || []).filter(Boolean).forEach(f => {
      const o = document.createElement('option'); o.value = String(f); o.textContent = String(f);
      sel.appendChild(o);
    });
    if (EST?.fechaForm){
      const i = [...sel.options].findIndex(o => o.value === EST.fechaForm);
      if (i >= 0) sel.selectedIndex = i;
    }
  }

  function renderGrid(res){
      const grid   = $('gridIds'); 
      if (!grid) return;
      grid.innerHTML = '';
      const ids    = res.ids || [];
      const done   = res.doneFlags || [];
      const curr   = res.currVals || [];
      const prev   = res.prevVals || [];
      const rlist  = rowsList();

      ids.forEach((id, idx) => {
        const b = document.createElement('button');
        b.type = 'button'; b.className = 'idbtn';

        const title = document.createElement('div');
        title.textContent = id || '(sin ID)';
        const lectura = document.createElement('div');
        lectura.className = 'chip-reading';
        lectura.textContent = (curr[idx] !== '' && curr[idx] != null) ? String(curr[idx]) : '—';
        b.appendChild(title);
        b.appendChild(lectura);

        const ok = !!done[idx];
        b.style.backgroundColor = ok ? 'var(--donebg)'    : 'var(--missbg)';
        b.style.borderColor     = ok ? 'var(--doneborder)': 'var(--missborder)';
        b.style.color           = ok ? 'var(--donecolor)' : 'var(--misscolor)';

        b.onclick = () => {
          document.querySelectorAll('.idbtn.sel').forEach(n => n.classList.remove('sel'));
          b.classList.add('sel');

          seleccionado = { idx, row: rlist[idx], id: id || '' };
          prevDeSeleccionado = prev[idx];

          text($('idSel'),   seleccionado.id || '(sin ID)');
          text($('prevVal'), (prev[idx] !== '' && prev[idx] != null) ? String(prev[idx]) : '—');

          const inp = $('inpValor');
          inp.value = (curr[idx] !== '' && curr[idx] != null) ? curr[idx] : '';
          inp.focus(); inp.select();
          text($('msg'), '');
        };

        grid.appendChild(b);
      });

      if (res.viewOnly){
        enable($('inpValor'), true);
        enable($('btnGuardar'), true);
      }
    }

  function cargarEstado(){
    const msg = $('msg');
    text(msg, 'Cargando estado...');
    
    const p = window.parent;
    if (!p || typeof p.netRun !== 'function') {
      text(msg, 'Error: Sin conexión con el servidor principal.');
      return;
    }
    
    // 1. Llamada al padre para obtener el estado
    p.netRun()
      .withSuccessHandler(res => {
        if (!res || typeof res !== 'object') { text(msg,'Error: Respuesta inválida.'); return; }
        if (res.ok === false)                { text(msg,'Error: ' + (res.error || 'sin detalle')); return; }
        
        if (res.listoParaConsolidar) {
          const confirmar = confirm(
            res.mensaje + "\n\n¿Desea Ejecutar el Consolidado de Lecturas Ahora Mismo?⤴️"
          );

          if (confirmar) {
            text(msg, '⏳ Espere...');
            
            // 2. Llamada al padre para consolidar
            p.netRun()
              .withSuccessHandler(resConsolidado => {
                if (resConsolidado && resConsolidado.ok) {
                  alert("✅ " + (resConsolidado.mensaje || "Consolidado realizado con éxito."));
                  res.mensaje = '✅ Consolidado Completado. Cierre y Vuelva Abrir el Registro ➕';
                  if ($('gridIds')) $('gridIds').innerHTML = '';
                  pintar(res);
                  text(msg, '');
                  cerrarModal();
                } else {
                  alert("❌ Error al consolidar: " + (resConsolidado ? resConsolidado.error : 'Sin detalle'));
                  pintar(res);
                  text(msg, '');
                }
              })
              .withFailureHandler(err => {
                alert("❌ Error de comunicación: " + (err?.message || err));
                pintar(res);
                text(msg, '');
              })
              .correrContometros(typeof AUTH_TOKEN !== 'undefined' ? AUTH_TOKEN : '');
            return;
          } else {
            pintar(res);
            if ($('idSel')) $('idSel').textContent = '—';
            if ($('prevVal')) $('prevVal').textContent = '—';
            if ($('inpValor')) {
              $('inpValor').value = '';
              $('inpValor').placeholder = 'Lectura a Registrar...';
              $('inpValor').disabled = true;
            }
            if ($('btnGuardar')) $('btnGuardar').disabled = true;
            text(msg, '⚠️ El Periodo Actual Debe Consolidarse Antes de Realizar Nuevos Registros.');
            return;
          }
        }

        pintar(res); 
        text(msg, '');
      })
      .withFailureHandler(err => text(msg, 'Error: ' + (err?.message || err)))
      .getEstadoContometros(typeof AUTH_TOKEN !== 'undefined' ? AUTH_TOKEN : '');
  }

  // ===== Listeners
  $('btnVerLecturas')?.addEventListener('click', () => {
      const msg = $('msg');
      const sel = $('cboFechas');
      const fechaSel = sel && sel.value ? String(sel.value) : '';
      const divNuevaFecha = $('contenedorNuevaFecha');
      if (divNuevaFecha) divNuevaFecha.style.display = 'none';

      msg.classList.remove('warn'); msg.classList.add('flat');
      text(msg, 'Cargando lecturas de ' + fechaSel + '…');

      const p = window.parent;
      if (!p || typeof p.netRun !== 'function') {
        msg.classList.remove('flat'); msg.classList.add('warn');
        text(msg, 'Error: Sin conexión con el servidor principal.');
        return;
      }

      p.netRun()
        .withSuccessHandler(r => {
          const merged = Object.assign({}, EST || {}, r || {}, { viewOnly: true, fechas: r?.fechas || [] });
          EST = merged; 
          pintar(merged); 
          text(msg, 'Listo ✔️');
        })
        .withFailureHandler(err => {
          msg.classList.remove('flat'); msg.classList.add('warn');
          text(msg, 'Error al cargar lecturas: ' + (err?.message || String(err)));
        })
        .verLecturasPorFecha(fechaSel);
    });

  $('btnToggleLecturas')?.addEventListener('click', () => {
      mostrarLecturas = !mostrarLecturas;
      $('gridIds')?.classList.toggle('show-readings', mostrarLecturas);
      const b = $('btnToggleLecturas'); if (b) b.textContent = mostrarLecturas ? 'Ocultar lecturas' : 'Mostrar lecturas';
    });

  let guardandoFecha = false;
  $('btnGuardarFecha')?.addEventListener('click', () => {
      if (guardandoFecha) return;
      const btn = $('btnGuardarFecha'), msg = $('msg');
      const s = String($('inpFechaNueva')?.value || '').trim();
      if (!s){ msg.classList.remove('flat'); msg.classList.add('warn'); text(msg,'Seleccione una fecha valida.'); return; }

      const p = window.parent;
      if (!p || typeof p.netRun !== 'function') {
        msg.classList.remove('flat'); msg.classList.add('warn');
        text(msg, 'Error: Sin conexión con el servidor principal.');
        return;
      }

      guardandoFecha = true; btn.disabled = true;
      const old = btn.textContent; btn.textContent = 'Registrando...';
      msg.classList.remove('warn'); msg.classList.add('flat'); text(msg,'Iniciando Periodo...');

      p.netRun()
        .withSuccessHandler(r => {
          msg.classList.remove('flat'); msg.classList.add('warn');
          if (!r || typeof r !== 'object')       text(msg, 'Error: respuesta inválida al guardar fecha.');
          else if (!r.ok)                        text(msg, 'Error: ' + (r.error || 'No se pudo guardar la fecha.'));
          else { 
            msg.classList.remove('warn'); msg.classList.add('flat'); 
            text(msg, r.alreadySet ? 'La fecha ya está registrada. ✔️' : 'Espere un momento... ⏳'); 
            cargarEstado(); 
          }
          guardandoFecha = false; btn.disabled = false; btn.textContent = old;
        })
        .withFailureHandler(err => {
          guardandoFecha = false; btn.disabled = false;
          text(msg, 'Error: ' + (err?.message || String(err))); btn.textContent = old;
        })
        .guardarFechaNueva(s, typeof AUTH_TOKEN !== 'undefined' ? AUTH_TOKEN : '', typeof AUTH_USER !== 'undefined' ? AUTH_USER : '');
    });

  $('btnGuardar')?.addEventListener('click', () => {
      const msg = $('msg');
      if (!EST || EST.doneAll) return;
      if (!seleccionado){ msg.classList.remove('flat'); msg.classList.add('warn'); text(msg,'Elija un Dpto.'); return; }

      const valStr = String($('inpValor').value || '').trim();
      if (!/^-?\d+$/.test(valStr)){ msg.classList.remove('flat'); msg.classList.add('warn'); text(msg,'Ingrese una lectura válida.'); return; }
      const valNum = parseInt(valStr, 10);

      const idx = seleccionado.idx, grid = $('gridIds');
      const btnId = (grid && Number.isInteger(idx)) ? grid.children[idx] : null;
      const yaEstabaVacio = EST?.currVals && (EST.currVals[idx] === '' || EST.currVals[idx] == null);

      let prevStyle = null;
      if (btnId){
        prevStyle = { bg:btnId.style.backgroundColor, border:btnId.style.borderColor, color:btnId.style.color, disabled:btnId.disabled, sel:btnId.classList.contains('sel') };
        btnId.style.backgroundColor='var(--donebg)';
        btnId.style.borderColor='var(--doneborder)';
        btnId.style.color='var(--donecolor)';
        btnId.classList.remove('sel'); btnId.disabled = true;
      }
      if (EST){ if (EST.currVals) EST.currVals[idx] = valNum; if (EST.doneFlags) EST.doneFlags[idx] = true; }
      if (yaEstabaVacio){ const h=$('hechos'); if (h) h.textContent = String((parseInt(h.textContent||'0',10)+1)); }

      msg.classList.remove('warn'); msg.classList.add('flat'); text(msg,'Enviando…');
      $('btnGuardar').disabled = true;

      function revertUI(){
        if (!btnId || !prevStyle) return;
        btnId.style.backgroundColor = prevStyle.bg;
        btnId.style.borderColor     = prevStyle.border;
        btnId.style.color           = prevStyle.color;
        btnId.disabled              = prevStyle.disabled;
        if (prevStyle.sel) btnId.classList.add('sel');

        if (EST && yaEstabaVacio){
          if (EST.currVals) EST.currVals[idx] = '';
          if (EST.doneFlags) EST.doneFlags[idx] = false;
          const h=$('hechos'); if (h) h.textContent = String(Math.max(0, parseInt(h.textContent||'0',10)-1));
        }
      }

      const p = window.parent;
      if (!p || typeof p.netRun !== 'function') {
        $('btnGuardar').disabled = false;
        revertUI();
        msg.classList.remove('flat'); msg.classList.add('warn');
        text(msg, 'Error: Sin conexión con el servidor principal.');
        return;
      }

      const token = typeof AUTH_TOKEN !== 'undefined' ? AUTH_TOKEN : '';
      const user = typeof AUTH_USER !== 'undefined' ? AUTH_USER : '';
      const payload = { row: seleccionado.row, value: valNum, col: EST.lastCol, fechaSel: EST?.fechaSel || EST?.fechaForm || '',  authToken: token, seleccionado: seleccionado };

      p.netRun()
        .withSuccessHandler(res => {
          $('btnGuardar').disabled = false;
          if (res && !res.ok && res.requiereConfirmacion) {
            const acepta = confirm(res.mensajeConfirmacion);
            if (acepta) {
              $('btnGuardar').disabled = true;
              payload.confirmado = true;

              p.netRun()
                .withSuccessHandler(res2 => {
                  $('btnGuardar').disabled = false;
                  if (!res2 || typeof res2 !== 'object' || !res2.ok) {
                    revertUI(); msg.classList.remove('flat'); msg.classList.add('warn');
                    text(msg, 'Error: ' + (res2 && res2.error ? res2.error : 'respuesta inválida.'));
                    return;
                  }
                  msg.classList.remove('warn'); msg.classList.add('flat'); text(msg,'Guardado ✔️'); setTimeout(()=>cargarEstado(),0);
                })
                .withFailureHandler(err2 => {
                  $('btnGuardar').disabled = false;
                  revertUI(); msg.classList.remove('flat'); msg.classList.add('warn'); text(msg,'Error: ' + (err2?.message || String(err2)));
                })
                .guardarLecturaContometros(payload, user);
              return;
            } else {
              revertUI();
              text(msg, 'Operación cancelada.');
              return;
            }
          }
          if (!res || typeof res !== 'object' || !res.ok){
            revertUI(); msg.classList.remove('flat'); msg.classList.add('warn');
            text(msg, 'Error: ' + (res && res.error ? res.error : 'respuesta inválida.')); return;
          }
          msg.classList.remove('warn'); msg.classList.add('flat'); text(msg,'Guardado ✔️'); setTimeout(()=>cargarEstado(),0);
        })
        .withFailureHandler(err => {
          $('btnGuardar').disabled = false;
          revertUI(); msg.classList.remove('flat'); msg.classList.add('warn'); text(msg,'Error: ' + (err?.message || String(err)));
        })
        .guardarLecturaContometros(payload, user);
    });

  // Validación de lectura en tiempo real
  $('inpValor')?.addEventListener('input', function(){
    const msg=$('msg'), btn=$('btnGuardar'), s=this.value.trim();
    if (s==='' || isNaN(s) || prevDeSeleccionado==null){
      this.style.borderColor=''; msg.textContent=''; this.classList.remove('input-error'); if(btn) btn.disabled=true; return;
    }
    const n=parseInt(s,10);
    if (n < prevDeSeleccionado){
      this.classList.add('input-error'); msg.classList.remove('flat'); msg.classList.add('warn');
      text(msg,'🚫 La lectura actual no puede ser menor que la anterior ('+prevDeSeleccionado+').'); if(btn) btn.disabled=true; return;
    }
    const ps=String(Math.abs(parseInt(prevDeSeleccionado,10))), cs=String(Math.abs(n));
    if (cs.length > ps.length){
      const ok = (ps.charAt(0)==='9' && cs.charAt(0)==='1' && cs.length===ps.length+1);
      if (!ok){
        this.classList.add('input-error'); msg.classList.remove('flat'); msg.classList.add('warn');
        text(msg,'⚠️ La lectura ingresada tiene valor muy alto, favor corregir'); if(btn) btn.disabled=true; return;
      }
    }
    this.classList.remove('input-error'); this.style.borderColor=''; msg.classList.remove('warn'); msg.classList.add('flat'); msg.textContent=''; if(btn) btn.disabled=false;
  });

  // Validación de seguridad inicial
  if (!AUTH_TOKEN){
    try { parent.postMessage({ type:'contometros-auth-expired' }, '*'); } catch(e){}

    const estado = $('estado');
    const msg    = $('msg');
    if (estado){ estado.textContent = 'ACCESS DENIED: USUARIO NO AUTORIZADO! 🚨'; estado.style.color = 'red'; }
    if (msg){ msg.textContent = 'Debes Autenticarte Para Registrar Lecturas.'; msg.classList.add('warn'); }

    $('btnGuardar')?.setAttribute('disabled','disabled');
    $('btnGuardarFecha')?.setAttribute('disabled','disabled');
    $('btnVerLecturas')?.setAttribute('disabled','disabled');
    $('btnToggleLecturas')?.setAttribute('disabled','disabled');
    $('inpValor')?.setAttribute('disabled','disabled');

    const grid = $('gridIds');
    if (grid){ grid.style.pointerEvents = 'none'; grid.style.opacity = '0.6'; }
    return;
  }

  cargarEstado();
})();
</script>
</body>
</html>
