<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<title>Registro Movimientos Bancarios</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />

<!-- 1. Cargar Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script>
  // Configuración corregida (sin protocolo duplicado)
  const firebaseConfig = {
    databaseURL: "https://gaviotas160-default-rtdb.firebaseio.com/"
  };
  if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
  const db = firebase.database();
  
</script>

<style>
  :root {
    --color-bg:#f5f7fa; --color-card:#ffffff; --color-border:#d0d5dd; --color-border-strong:#b5bcc6;
    --color-text:#1d2430; --color-label:#475467; --color-primary:#1f5fa8; --color-primary-hover:#174a83; --color-primary-active:#12375a;
    --color-secondary-bg:#eef1f5; --color-secondary-bg-hover:#e0e5ea; --color-secondary-text:#344054;
    --color-focus-ring:rgba(31,95,168,.35); --color-error:#d62f41; --color-info-bg:#f0f4f8;
    --radius-s:4px; --radius-m:10px;
    --shadow-card:0 4px 12px -2px rgba(22,34,55,0.10),0 2px 4px rgba(22,34,55,0.06);
    --transition:150ms cubic-bezier(.4,.0,.2,1);
    --font-stack: system-ui,-apple-system,"Segoe UI",Roboto,Inter,Arial,sans-serif;
  }
  html,body {height:100%; margin:0; font-family:var(--font-stack); background:var(--color-bg); color:var(--color-text); -webkit-font-smoothing:antialiased;}
  body { display:flex; align-items:center; justify-content:center; padding:24px; }
  .card { width:100%; max-width:540px; background:var(--color-card); border:1px solid #e2e6eb;
          border-radius:var(--radius-m); box-shadow:var(--shadow-card); padding:24px 28px 28px; position:relative; }
  .card-header { margin-bottom:22px; }
  .title { font-size:1.35rem; font-weight:600; letter-spacing:.5px; margin:0 0 6px; color:var(--color-primary); }
  .subtitle { margin:0; font-size:.78rem; text-transform:uppercase; letter-spacing:1.2px; font-weight:600; color:var(--color-label); opacity:.85; }
  form { display:flex; flex-direction:column; gap:18px; }
  label.field { display:flex; flex-direction:column; gap:6px; font-size:.8rem; font-weight:600; letter-spacing:.7px;
                text-transform:uppercase; color:var(--color-label); }
  .req::after { content:""; color:var(--color-primary); font-weight:700; }
  input[type=text] { width:100%; padding:10px 11px; font-size:.95rem; border:1px solid var(--color-border);
                     border-radius:var(--radius-s); background:#fff; transition:var(--transition); font-family:inherit; }
  input:focus { outline:none; border-color:var(--color-primary); box-shadow:0 0 0 3px var(--color-focus-ring); }
  input.error { border-color:var(--color-error); box-shadow:0 0 0 3px rgba(214,47,65,.25); }

  .id-block { background:var(--color-info-bg); border:1px solid var(--color-border-strong);
              border-radius:var(--radius-s); padding:12px 14px 14px; display:flex; flex-direction:column; gap:8px; }
  .id-label { font-size:.72rem; text-transform:uppercase; font-weight:700; letter-spacing:.8px; color:#4b5b6b; margin:0; }
  .id-value { font-family:monospace; font-size:.9rem; background:#fff; border:1px solid var(--color-border-strong);
              padding:8px 8px; border-radius:6px; line-height:1.2; color:#1d2430; letter-spacing:.5px; user-select:all; }
  .id-meta { font-size:.7rem; display:flex; flex-direction:column; gap:2px; color:#475467; line-height:1.25; }
  .id-meta span strong { font-weight:600; color:#344054; }
  .id-hint { font-size:.58rem; letter-spacing:.6px; text-transform:uppercase; color:#667085; font-weight:600; }
  
  .feedback { font-size:.90rem; min-height:18px; font-weight:500; letter-spacing:.3px; }
  .feedback.ok { color: green; }
  .feedback.err { color:var(--color-error); }

  .actions { display:flex; gap:12px; justify-content:flex-end; margin-top:4px; flex-wrap:wrap; }
  button.primary, button.secondary, button.tertiary {
    font-family:inherit; font-size:.85rem; font-weight:600; letter-spacing:.6px;
    padding:10px 18px; border-radius:var(--radius-s); border:1px solid transparent;
    cursor:pointer; position:relative; overflow:hidden; transition:var(--transition);
  }
  button.primary { background:linear-gradient(135deg,var(--color-primary),#0f497f); color:#fff; }
  button.primary:hover { background:linear-gradient(135deg,var(--color-primary-hover),#12375a); }
  button.primary:active { background:var(--color-primary-active); transform:translateY(1px); }
  button.secondary { background:var(--color-secondary-bg); color:var(--color-secondary-text); border-color:var(--color-border); }
  button.secondary:hover { background:var(--color-secondary-bg-hover); }
  button.tertiary { background:#fff; color:#334155; border:1px solid var(--color-border); }
  button.tertiary:hover { background:#f1f5f9; }

  .divider { height:1px; background:linear-gradient(to right,#dfe3e8,#eef1f5,#dfe3e8); margin:2px 0 4px; border:none; }

  .dual-ring{ display:inline-block;width:18px;height:18px; }
  .dual-ring:after{
    content:"";display:block;width:18px;height:18px;
    border:3px solid var(--color-primary);
    border-color:var(--color-primary) transparent var(--color-primary) transparent;
    border-radius:50%; animation:dual-spin 1s linear infinite;
  }
  @keyframes dual-spin{to{transform:rotate(360deg)}}
  .hidden{display:none}
</style>
</head>
<body>
  <div class="card" role="dialog" aria-labelledby="titulo-form" aria-modal="true">
    <header class="card-header">
      <p class="subtitle">Gestión Bancaria</p>
      <h1 class="title" id="titulo-form">Registro Movimientos Bancarios 🏦</h1>
      <hr class="divider" />
    </header>

    <form id="formMovimientos" novalidate> 
      <label class="field req" for="fechaMovimiento">
        📅 Fecha Movimiento
        <input type="text" id="fechaMovimiento" name="fechaMovimiento" placeholder="Desde Extracto Bancario" autocomplete="off" required />
      </label>

      <label class="field req" for="descripcionMovimiento">
        📋 Descripción Movimiento
        <input type="text" id="descripcionMovimiento" name="descripcionMovimiento" placeholder="Desde Extracto Bancario" maxlength="50" autocomplete="off" required />
      </label>

      <label class="field req" for="montoMovimiento">
        💰 Monto Movimiento
        <input type="text" id="montoMovimiento" name="montoMovimiento" placeholder="Desde Extracto Bancario" autocomplete="off" required />
      </label>

      <label class="field" for="datosMovimiento">
        🆔 ID RELACIONADO AL MOVIMIENTO
        <input type="text" id="datosMovimiento" name="datosMovimiento" placeholder="Depa.. / Servicios.. / Gastos.." maxlength="9" autocomplete="off" required />
      </label>

      <label class="field" for="presetSelect">
        💡 SERVICIOS
        <select id="presetSelect" style="margin-top:4px;padding:9px 10px;font-size:.95rem;border:1px solid var(--color-border);border-radius:var(--radius-s);color:rgba(0,0,0,0.5);width:50%;">
          <option value="">-- Selecciona el Servicio --</option>
          <option value="LUZ1">LUZ1</option>
          <option value="LUZ2">LUZ2</option>
          <option value="ADMIN">ADMIN</option>
          <option value="SEDAPAL">SEDAPAL</option>
          <option value="ANDINOS">ANDINOS</option>
        </select>
      </label>

      <div class="feedback" id="feedback">
        <span id="loader" class="dual-ring hidden" aria-hidden="true"></span>
        <span id="fbMsg"></span>
      </div>

      <div class="id-block" aria-labelledby="idLabel">
        <p class="id-label" id="idLabel">HASH-TRANSACCION</p>
        <div class="id-value" id="idMovimientoDisplay">MB-YYYY-MM-DD-XXXX</div>
        <div class="id-meta" id="idMeta">
          <span id="metaFecha"><strong>Fecha actual:</strong> —</span>
          <span id="metaUsuario"><strong>User:</strong> —</span>
        </div>
        <div class="id-hint">Administración Las Gaviotas 160.</div>
      </div>

      <div class="actions">
        <button type="button" class="secondary" id="btnSalir">❌ Close</button>
        <button type="button" class="tertiary" id="btnLimpiar">Limpiar</button>
        <button type="submit" class="primary" id="btnRegistrar">Registrar</button>
      </div>
    </form>
  </div>

  <script>
    const f = document.getElementById('formMovimientos');
    const inputFecha = document.getElementById('fechaMovimiento');
    const inputMonto = document.getElementById('montoMovimiento');
    const inputDesc = document.getElementById('descripcionMovimiento');
    const inputDatos = document.getElementById('datosMovimiento');
    const presetSelect = document.getElementById('presetSelect');
    const fbWrap = document.getElementById('feedback');
    const fbMsg = document.getElementById('fbMsg');
    const loader = document.getElementById('loader');

    let correoUsuario = '';
    let listaDepas = [];
    let listaServs = [];

    const params = new URLSearchParams(location.search);
    const AUTH_TOKEN = params.get('token') || sessionStorage.getItem('AUTH_TOKEN') || '';
    if (params.get('token')) sessionStorage.setItem('AUTH_TOKEN', params.get('token'));
    const AUTH_USER_PARAM = params.get('user') || '';
    const AUTH_USER = AUTH_USER_PARAM || sessionStorage.getItem('AUTH_USER') || '';
    const LOCK_MSG = 'Debes Autenticarte Para Registrar Movimientos.';
    const p = window.parent;

    function disableForm(){
      document.querySelectorAll('input, select, textarea, button').forEach(el => {
        if (el.id !== 'btnSalir') el.disabled = true;
      });
    }

    function renderMetaUsuario(){
      const mu = document.getElementById('metaUsuario');
      if (!mu) return;
      mu.innerHTML = `<strong>Admin Account:</strong> ${correoUsuario || '—'} <span style="margin:0 8px; opacity:.6">|</span> <strong>User:</strong> ${AUTH_USER || '—'}`;
     }

    function setMensajeAuth(texto, color, esError = false) {
      if (!fbMsg) return;
      fbMsg.textContent = texto;
      fbMsg.style.color = color;
      
      if (fbWrap) {
        fbWrap.style.display = 'block';
        fbWrap.className = 'feedback ' + (esError ? 'err' : 'ok');
      }
    }
    
    // 2. Función para evaluar el estado y decidir qué mensaje mostrar
    function validarMensajeInicial() {
      if (!AUTH_TOKEN) {
        setMensajeAuth('USUARIO RESTRINGIDO', 'red', true);
        disableForm();
      } else {
        const usuario = AUTH_USER || 'Usuario';
        setMensajeAuth(`¡Hola ${usuario}! Todo Listo.`, '#0249FA', false);
      }
    }
    

    const REG_FECHA = /^\d{2}\/\d{2}\/\d{4}$/;
    const REG_MONTO = /^S\/-?\d{1,3}(?:,\d{3})*\.\d{2}$/;

    function limpiarFecha(str){ return (str || '').trim().replace(/\s+/g,''); }
    function limpiarMonto(str){ return (str || '').trim().replace(/\s+/g,''); }

    let idFijo = null;
    function generarIDFijo() {
      if (idFijo) return idFijo;
      const d = new Date();
      const y = d.getFullYear();
      const m = String(d.getMonth()+1).padStart(2,'0');
      const day = String(d.getDate()).padStart(2,'0');
      const rand = Math.random().toString(36).substring(2,6).toUpperCase();
      idFijo = `MB-${y}-${m}-${day}-${rand}`;
      return idFijo;
    }

    function fechaLargaES(d) {
      const dias = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
      const meses = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
      return `${dias[d.getDay()]}, ${d.getDate()} de ${meses[d.getMonth()]} de ${d.getFullYear()}`;
    }

    function fechaValida(fechaStr) {
      const f = limpiarFecha(fechaStr);
      if (!REG_FECHA.test(f)) return false;
      const [dd, mm, yyyy] = f.split('/').map(n => parseInt(n,10));
      const d = new Date(yyyy, mm - 1, dd);
      return d.getFullYear() === yyyy && (d.getMonth()+1) === mm && d.getDate() === dd;
    }

    function fechaEnPeriodoActual(fechaStr) {
      const f = limpiarFecha(fechaStr);
      if (!fechaValida(f)) return false;
      const [dd, mm, yyyy] = f.split('/').map(n => parseInt(n,10));
      const hoy = new Date();
      return (yyyy === hoy.getFullYear() && mm === (hoy.getMonth() + 1) && dd <= hoy.getDate());
    }

    function initIDBlock() {
      const now = new Date();
      document.getElementById('idMovimientoDisplay').textContent = generarIDFijo();
      document.getElementById('metaFecha').innerHTML = `<strong>Date:</strong> ${fechaLargaES(now)}`;
      renderMetaUsuario();
    }
    initIDBlock();
    validarMensajeInicial();

    if (p && p.LISTAS && p.LISTAS.depaIds?.length && p.LISTAS.servIds?.length) {
      // 1. Si ya existen en memoria, las toma al instante
      listaDepas = p.LISTAS.depaIds;
      listaServs = p.LISTAS.servIds;
      updateTipoMovimiento();
    } else if (p && typeof p.netRun === 'function') {
      // 2. Si no están, las pide directo a Apps Script
      p.netRun().withSuccessHandler(res => {
        listaDepas = (res?.depaIds || []).map(x => String(x).trim().toUpperCase());
        listaServs = (res?.servIds || []).map(x => String(x).trim().toUpperCase());
        
        // Guarda en memoria para no volver a pedir
        p.LISTAS = { depaIds: listaDepas, servIds: listaServs };
        updateTipoMovimiento();
      }).getListasIdBanco();
    }

    if (p && typeof p.netRun === 'function') {
      p.netRun()
        .withSuccessHandler(meta => {
          correoUsuario = meta?.email || AUTH_USER || 'Sistema Local';
          renderMetaUsuario();
        })
        .withFailureHandler(() => {
          correoUsuario = AUTH_USER || '—';
          renderMetaUsuario();
        })
        .getCuentaUsuario();
    } else {
      correoUsuario = AUTH_USER || '—';
      renderMetaUsuario();
    }

    // Cierre local
    document.getElementById('btnSalir')?.addEventListener('click', () => {
      try { parent.closeForm('banco'); } catch(e){}
    });

    document.getElementById('btnLimpiar')?.addEventListener('click', () => limpiarFormulario());

    function limpiarFormulario(regenerarId = false, opts = {}){
      inputFecha.value = '';
      inputDesc.value = '';
      inputMonto.value = '';
      inputDatos.value = '';
      resetErrors();

      if (presetSelect) presetSelect.selectedIndex = 0;
      if (!opts.silent) {
        fbMsg.textContent = 'Clean 🧹';
        fbWrap.className = 'feedback ok';
      }
      loader.classList.add('hidden');

      if (regenerarId){
        idFijo = null;
        initIDBlock();
      }
    }

// Submit del Formulario corregido con netRun directo
f.addEventListener('submit', (e) => {
  e.preventDefault();
  fbMsg.textContent = ''; 
  fbWrap.className = 'feedback';
  resetErrors();

  const fecha = limpiarFecha(inputFecha.value);
  const desc = (inputDesc.value || '').trim();
  const monto = limpiarMonto(inputMonto.value);
  const datos = (inputDatos.value || '').trim();
  const idUpper = datos.toUpperCase();
  const montoClean = (monto || '').replace(/^S\//, '');
  const montoSign = montoClean.startsWith('-') ? -1 : 1;

  const erroresInputs = [];

  if (!fecha) addError(inputFecha,'⛔ Fecha obligatoria');
  else if(!REG_FECHA.test(fecha)) addError(inputFecha,'⛔ Formato fecha debe ser: DD/MM/AAAA');
  else if(!fechaValida(fecha)) addError(inputFecha,'⛔ Fecha inválida');
  else if(!fechaEnPeriodoActual(fecha)) addError(inputFecha,'⛔ La fecha introducida no corresponde al periodo actual');

  if(!desc) addError(inputDesc,'⛔ Descripción obligatoria');
  else if(desc.length < 4) addError(inputDesc,'⛔ La descripción debe ser mínimo 4 caracteres');

  if (monto && REG_MONTO.test(monto) && datos && datos.length >= 4) {
    if (listaDepas.includes(idUpper) && montoSign === -1) {
      addError(inputMonto, '⛔ El monto de PAGO por un Recibo NO puede ser Negativo');
    }
    if (listaServs.includes(idUpper) && montoSign === 1) {
      addError(inputMonto, '⛔ El monto de PAGO por un Servicio NO puede ser Positivo');
    }
  }

  if(!monto) addError(inputMonto,'⛔ Monto obligatorio');
  else if(!REG_MONTO.test(monto)) addError(inputMonto,'⛔ Copie el monto desde el extracto bancario');

  if(!datos) addError(inputDatos,'⛔ ID obligatorio');
  else if(datos.length < 4) addError(inputDatos,'⛔ ID debe ser mínimo 4 caracteres');

  Array.from(document.querySelectorAll('input.error')).forEach(el => {
    if(el.dataset.err) erroresInputs.push(el.dataset.err);
  });

  if(!idFijo || idFijo.length < 4) erroresInputs.push('⚠️ ID inválido (autogeneración falló)');

  const allErrors = [...new Set(erroresInputs)];

  if (allErrors.length) {
    fbMsg.innerHTML = '<ul style="margin:4px 0 0 18px;padding:0;">' + allErrors.map(e => '<li>'+escapeHtml(e)+'</li>').join('') + '</ul>';
    fbWrap.className = 'feedback err';
    fbMsg.style.color = 'red'; 
    return;
  }

  const payload = {
    fechaMov: fecha,
    descripMov: desc,
    montoMov: monto.replace(/^S\//,''),
    cuentaUser: typeof AUTH_USER !== 'undefined' ? AUTH_USER : '',
    iDmov: datos,
    authToken: typeof AUTH_TOKEN !== 'undefined' ? AUTH_TOKEN : ''
  };

  fbMsg.textContent = ' ⤴️🖥️ Enviando datos al servidor…';
  fbMsg.style.color = 'blue'; 
  loader.classList.remove('hidden');
  const btn = document.getElementById('btnRegistrar');
  btn.disabled = true;

  if (!p || typeof p.netRun !== 'function') {
    alert('No se pudo conectar con el servidor principal');
    loader.classList.add('hidden');
    btn.disabled = false;
    return;
  }

  // 1. Primera llamada directa mediante netRun
  p.netRun()
    .withSuccessHandler(res => {
      loader.classList.add('hidden');
      btn.disabled = false;

      if (res && res.needCode) {
        const ok = pedirCodigoCliente(res.mensaje, res.code, res.maxAttempts || 3);
        if (!ok) {
          fbMsg.textContent = '🚨 OPERACIÓN CANCELADA POR EL USUARIO';
          fbMsg.style.color = 'red';
          fbWrap.className = 'feedback err';
          return;
        }
        fbMsg.textContent = 'Validación correcta! ✔️ Registrando…';
        fbWrap.className = 'feedback ok';
        loader.classList.remove('hidden');
        btn.disabled = true;

        // 2. Segunda llamada de confirmación directa mediante netRun
        const payloadConfirm = Object.assign({}, payload, { skipConfirm: true });
        p.netRun()
          .withSuccessHandler(r2 => {
            loader.classList.add('hidden');
            btn.disabled = false;
            if (r2 && r2.ok){
              fbMsg.textContent = r2.mensaje || '✅ REGISTRO COMPLETADO ✅';
              fbWrap.className = 'feedback ok';
              limpiarFormulario(true, { silent:true });
            } else {
              fbMsg.innerHTML = '<ul style="margin:4px 0 0 18px;padding:0;">' + ((r2 && r2.errores)||[]).map(e=>'<li>'+escapeHtml(e)+'</li>').join('') + '</ul>';
              fbWrap.className = 'feedback err';
            }
          })
          .withFailureHandler(err => {
            alert(err?.message || String(err));
            loader.classList.add('hidden');
            btn.disabled = false;
          })
          .registrarHtml_bridge(payloadConfirm, typeof AUTH_TOKEN !== 'undefined' ? AUTH_TOKEN : '');
        return;
      }

      if (res && res.ok){
        fbMsg.textContent = res.mensaje || '✅ REGISTRO COMPLETADO ✅';
        fbWrap.className = 'feedback ok';
        limpiarFormulario(true, { silent:true });
      } else {
        fbMsg.innerHTML = '<ul style="margin:4px 0 0 18px;padding:0;">' + ((res && res.errores)||[]).map(e=>'<li>'+escapeHtml(e)+'</li>').join('') + '</ul>';
        fbWrap.className = 'feedback err';
      }
    })
    .withFailureHandler(err => {
      console.error('Error', err);
      alert(err?.message || String(err));
      loader.classList.add('hidden');
      btn.disabled = false;
    })
    .registrarHtml_bridge(payload, typeof AUTH_TOKEN !== 'undefined' ? AUTH_TOKEN : '');
});

    function addError(el,msg){ el.classList.add('error'); el.dataset.err = msg; }
    function resetErrors(){
      document.querySelectorAll('input.error').forEach(el => {
        el.classList.remove('error');
        el.dataset.err = '';
      });
    }

    function escapeHtml(s){
      return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    function updateTipoMovimiento() {
      const idRaw = inputDatos.value.trim().toUpperCase();
      const montoStr = limpiarMonto(inputMonto.value).replace(/^S\//,'');
      const montoNum = parseFloat(montoStr.replace(/,/g,'')) || 0;
      let mensaje = '';
      let color = '';

      if (idRaw.length > 3) {
        const esDepa = listaDepas.includes(idRaw);
        const esServ = listaServs.includes(idRaw);

        if (esDepa && montoNum > 0) {
          mensaje = '🧾 SE PROCESARÁ COMO PAGO DE RECIBO';
          color = '#034d06';
        } else if (esServ && montoNum < 0) {
          mensaje = '🛠️ SE PROCESARÁ COMO PAGO DE SERVICIOS';
          color = '#FF00FF';
        } else if (!esDepa && !esServ && montoNum > 0) {
          mensaje = '➕ SE PROCESARÁ COMO INGRESO A CUENTA';
          color = '#800080';
        } else if (!esDepa && !esServ && montoNum < 0) {
          mensaje = '➖ SE PROCESARÁ COMO GASTOS DE JUNTA O DEV.';
          color = '#8B0000';
        }
      }
      if (mensaje) {
        fbMsg.textContent = mensaje;
        fbMsg.style.color = color;
        if (fbWrap) fbWrap.className = 'feedback ok';
      }
    }

    inputDatos.addEventListener('input', updateTipoMovimiento);
    inputMonto.addEventListener('input', updateTipoMovimiento);
    presetSelect.addEventListener('change', () => {
      inputDatos.value = presetSelect.value || '';
      updateTipoMovimiento();
    });

    function pedirCodigoCliente(mensaje, code, maxAttempts){
      const intentosMax = Math.max(1, Number(maxAttempts) || 1);
      const promptMsg = (mensaje ? mensaje + '\n\n' : '') + '🔒 Código de validación: ' + String(code) + '\nIntroduzca el Código Para Validar esta Operación:';
      for (let i = 0; i < intentosMax; i++){
        const ingreso = window.prompt(promptMsg, '');
        if (ingreso === null){
          alert('❌ Operación cancelada.');
          return false;
        }
        if (String(ingreso).trim() === String(code)){
          return true;
        }
        const restantes = intentosMax - i - 1;
        if (restantes > 0){
          alert(`⛔ Código incorrecto. Intentos restantes: ${restantes}`);
        } else {
          alert('🛑 Error al validar. Registro cancelado.');
        }
      }
      return false;
    }
  </script> 
</body>
