<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 20px; background-color: #f5f7fb; }
    .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); max-width: 800px; margin: 0 auto; }
    h2 { color: #1a73e8; margin-top: 0; }
    .form-group { margin-bottom: 15px; }
    label { font-weight: bold; display: block; margin-bottom: 5px; }
    select, button { padding: 10px 15px; border-radius: 4px; border: 1px solid #ccc; font-size: 14px; }
    select { width: 100%; max-width: 300px; }
    button { background-color: #1a73e8; color: white; border: none; cursor: pointer; font-weight: bold; margin-right: 10px; }
    button:hover { background-color: #1557b0; }
    .btn-masivo { background-color: #34a853; }
    .btn-masivo:hover { background-color: #2d8e47; }
    #previewArea { margin-top: 20px; padding: 15px; background: #eef2f7; border-radius: 6px; font-family: monospace; white-space: pre-wrap; display: none; }
    .loading { display: none; color: #666; font-style: italic; margin-top: 10px; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Gestión e Impresión de Recibos - Las Gaviotas</h2>
    
    <div class="form-group">
      <label for="comboDepas">Seleccionar Departamento (ID):</label>
      <select id="comboDepas" onchange="cargarPrevisualizacion()">
        <option value="">-- Cargando lista de departamentos... --</option>
      </select>
    </div>

    <div>
      <button onclick="generarPDFDepaActual()">Generar PDF Seleccionado</button>
      <button class="btn-masivo" onclick="iniciarGeneracionMasiva()">Generar Masivo (74 Recibos)</button>
    </div>

    <div id="loading" class="loading">Procesando solicitud... por favor espere.</div>
    <div id="previewArea"></div>
  </div>

  <script>
    window.onload = function() {
      google.script.run
        .withSuccessHandler(function(lista) {
          const combo = document.getElementById('comboDepas');
          combo.innerHTML = '<option value="">-- Seleccione un ID --</option>';
          lista.forEach(function(id) {
            const opt = document.createElement('option');
            opt.value = id;
            opt.textContent = id;
            combo.appendChild(opt);
          });
        })
        .withFailureHandler(function(err) {
          alert('Error al obtener lista de departamentos: ' + err.message);
        })
        .obtenerListaDepartamentos();
    };

    function cargarPrevisualizacion() {
      const idDepa = document.getElementById('comboDepas').value;
      if (!idDepa) return;

      document.getElementById('loading').style.display = 'block';
      document.getElementById('previewArea').style.display = 'none';

      google.script.run
        .withSuccessHandler(function(data) {
          document.getElementById('loading').style.display = 'none';
          const preview = document.getElementById('previewArea');
          preview.style.display = 'block';
          preview.textContent = JSON.stringify(data, null, 2);
        })
        .withFailureHandler(function(err) {
          document.getElementById('loading').style.display = 'none';
          alert('Error: ' + err.message);
        })
        .obtenerDatosReciboPorId(idDepa);
    }

    function generarPDFDepaActual() {
      const idDepa = document.getElementById('comboDepas').value;
      if (!idDepa) {
        alert('Por favor selecciona un ID primero.');
        return;
      }
      document.getElementById('loading').style.display = 'block';
      google.script.run
        .withSuccessHandler(function(res) {
          document.getElementById('loading').style.display = 'none';
          alert('PDF Generado con éxito: ' + res.nombre);
        })
        .withFailureHandler(function(err) {
          document.getElementById('loading').style.display = 'none';
          alert('Error al generar PDF: ' + err.message);
        })
        .generarPDFParaDepartamento(idDepa);
    }

    function iniciarGeneracionMasiva() {
      if (!confirm('¿Desea iniciar la generación masiva de PDFs para todos los departamentos?')) return;
      document.getElementById('loading').style.display = 'block';
      google.script.run
        .withSuccessHandler(function(res) {
          document.getElementById('loading').style.display = 'none';
          alert('Proceso completado. Se procesaron ' + res.length + ' departamentos.');
        })
        .withFailureHandler(function(err) {
          document.getElementById('loading').style.display = 'none';
          alert('Error en generación masiva: ' + err.message);
        })
        .ejecutarGeneracionMasiva();
    }
  </script>
</body>
</html>
